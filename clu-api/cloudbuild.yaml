steps:
  # Build the Docker image
  - name: "gcr.io/cloud-builders/docker"
    args:
      - "build"
      - "-t"
      - "gcr.io/$PROJECT_ID/clu-api:$COMMIT_SHA"
      - "-t"
      - "gcr.io/$PROJECT_ID/clu-api:latest"
      - "."

  # Push the Docker image
  - name: "gcr.io/cloud-builders/docker"
    args:
      - "push"
      - "gcr.io/$PROJECT_ID/clu-api:$COMMIT_SHA"

  - name: "gcr.io/cloud-builders/docker"
    args:
      - "push"
      - "gcr.io/$PROJECT_ID/clu-api:latest"

  # Run database migrations
  - name: "gcr.io/$PROJECT_ID/clu-api:$COMMIT_SHA"
    entrypoint: "alembic"
    args: ["upgrade", "head"]
    env:
      - "DATABASE_URL=${_DATABASE_URL}"

  # Deploy to Cloud Run
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    entrypoint: "gcloud"
    args:
      - "run"
      - "deploy"
      - "clu-api"
      - "--image"
      - "gcr.io/$PROJECT_ID/clu-api:$COMMIT_SHA"
      - "--region"
      - "${_REGION}"
      - "--platform"
      - "managed"
      - "--set-env-vars"
      - "DATABASE_URL=${_DATABASE_URL},REDIS_URL=${_REDIS_URL},CHROMADB_HOST=${_CHROMADB_HOST},CHROMADB_PORT=${_CHROMADB_PORT},LOG_JSON=true,LOG_LEVEL=INFO"
      - "--set-secrets"
      - "ANTHROPIC_API_KEY=anthropic-api-key:latest"
      - "--port"
      - "8000"
      - "--memory"
      - "1Gi"
      - "--cpu"
      - "1"
      - "--min-instances"
      - "0"
      - "--max-instances"
      - "10"
      - "--concurrency"
      - "80"
      - "--timeout"
      - "300"
      - "--allow-unauthenticated"

substitutions:
  _REGION: us-central1
  _DATABASE_URL: ""
  _REDIS_URL: ""
  _CHROMADB_HOST: ""
  _CHROMADB_PORT: "8001"

images:
  - "gcr.io/$PROJECT_ID/clu-api:$COMMIT_SHA"
  - "gcr.io/$PROJECT_ID/clu-api:latest"

options:
  logging: CLOUD_LOGGING_ONLY
